<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Resolve high contrast before first paint. Keep in sync with src/lib/state/contrast.svelte.ts. -->
		<script>
			'use strict';
			(() => {
				const prefKey = 'contrast-preference';
				try {
					let pref = localStorage.getItem(prefKey);
					if (pref !== 'auto' && pref !== 'on' && pref !== 'off') {
						// Migrate users who enabled the original toggle (stored as a mode-watcher theme).
						const legacy = localStorage.getItem('mode-watcher-theme') === 'high-contrast';
						pref = legacy ? 'on' : 'auto';
						localStorage.setItem(prefKey, pref);
					}
					if (localStorage.getItem('mode-watcher-theme') === 'high-contrast') {
						localStorage.removeItem('mode-watcher-theme');
					}
					const on =
						pref === 'on' ||
						(pref === 'auto' && window.matchMedia('(prefers-contrast: more)').matches);
					if (on) {
						document.documentElement.setAttribute('data-contrast', 'more');
					}
				} catch {
					// Storage unavailable; fall back to the default (no high contrast).
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
