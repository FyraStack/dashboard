name: Accessibility

on:
  pull_request:
    paths:
      - ".github/workflows/accessibility.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/dashboard/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PNPM
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true
          runtime: node@lts

      - name: Locate Chromium
        run: |
          chromium_path="$(command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chromium_path" ]; then
            echo "Chromium is not installed on the runner" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chromium_path" >> "$GITHUB_ENV"

      - name: Run accessibility tests
        run: pnpm test:accessibility:ci
